<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Seja paciente modelo do Instituto Méstris em Campinas. Tratamentos faciais e odontológicos com supervisão docente.">
<title>Seja Nosso Paciente | Instituto Méstris</title>
<style>
:root{--brown:#21130b;--brown2:#382114;--gold:#bd783f;--gold-light:#f2b65d;--cream:#faf7f2;--ink:#171411;--muted:#657080;--green:#079455}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
a,a:link,a:visited,a:hover,a:active,a:focus{color:inherit;text-decoration:none}
.wrap{width:min(1120px,calc(100% - 44px));margin:auto}
.hero{color:#fff;background:linear-gradient(90deg,rgba(25,13,6,.97) 0%,rgba(35,19,10,.85) 43%,rgba(30,17,9,.16) 100%),url('hero-clinica.jpg') center/cover no-repeat}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:22px;min-height:78px}
.brand{width:260px;max-width:38%;height:66px;object-fit:contain;object-position:left center}
.nav{display:flex;align-items:center;gap:22px;font-size:13px}
.nav a{text-decoration:none}
.nav-cta{background:linear-gradient(100deg,#a96430,#c18a51);padding:12px 17px;border-radius:28px;color:white}
.hero-content{padding:28px 0 24px;min-height:325px;max-width:510px}
.hero h1{font:700 clamp(38px,4.6vw,56px)/.94 Georgia,'Times New Roman',serif;letter-spacing:-1.3px;margin:0 0 15px}
.hero h1 span{color:#f1b66c}
.hero-copy{font-size:16px;line-height:1.42;max-width:460px;margin:0 0 18px}
.benefits{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.benefit{display:flex;align-items:center;gap:9px;font-size:12px;line-height:1.35}
.benefit-icon{height:45px;width:45px;border:2px solid var(--gold-light);border-radius:50%;display:grid;place-items:center;color:var(--gold-light);flex:none}
.benefit-icon svg,.step-icon svg,.field-icon svg,.category svg,.nav-cta svg,.submit svg,.contact svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.field-icon{display:grid;place-items:center}
.field-icon svg{width:19px;height:19px}
.step-icon svg{width:25px;height:25px}
.category{display:flex;align-items:center;justify-content:center;gap:9px}
.category svg{width:27px;height:27px}
.nav-cta,.submit{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.submit{display:flex}
.intake{padding:18px 0 16px;background:linear-gradient(110deg,#fbf8f4,#f5f0e9)}
.intake-grid{display:grid;grid-template-columns:1.45fr .85fr;gap:20px;align-items:start}
.section-title{font:700 clamp(27px,3vw,36px)/1.05 Georgia,serif;letter-spacing:-.8px;margin:0 0 8px}
.section-title span,.faq h2 span,.team-copy h2 span{color:#b8753d}
.muted{color:var(--muted)}
.lead{font-size:14px;margin:0 0 15px}
.categories{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.category{min-height:54px;border:0;border-radius:9px;background:#efefed;color:#111;font-weight:700;cursor:pointer}
.category.active{background:linear-gradient(100deg,#ae6c32,#c18850);color:#fff}
.treatment-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.treatment-card{border:1px solid #eee8e1;border-radius:11px;background:#fffdfa;padding:16px 17px;box-shadow:0 4px 14px #2b1b1009}
.treatment-card h3{font:700 17px Georgia,serif;margin:0 0 10px}
.option{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.4;color:#4c5360;margin:8px 0;cursor:pointer}
.option input{accent-color:#a86b36;margin:2px 0 0;width:15px;height:15px;flex:none}
.form-card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 5px 22px #3520130b}
.form-card h2{font:700 23px/1.1 Georgia,serif;margin:0 0 7px}
.intro{font-size:12px;line-height:1.45;color:var(--muted);margin:0 0 12px}
.field{position:relative;margin-bottom:8px}
.field-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:#68707c;pointer-events:none}
.field input,.field textarea{display:block;width:100%;border:1px solid #dfe2e7;border-radius:6px;background:#fff;color:#333;padding:10px 11px 10px 42px;font-size:12px;min-height:39px;outline-color:#c18a51}
.field input:focus,.field textarea:focus{color:#333}
.contact a:link,.contact a:visited,.contact a:hover,.contact a:active,.contact a:focus{color:inherit;text-decoration:none}
.field textarea{height:65px;resize:vertical;padding-top:11px}
.field input[readonly]{background:#f8f6f3;cursor:default}
.submit{display:block;width:100%;border:0;border-radius:25px;background:var(--green);color:white;font-size:13px;font-weight:700;padding:13px;cursor:pointer;margin-top:10px}
.submit:hover{filter:brightness(.95)}
.fine{font-size:10px;line-height:1.45;color:#68707c;margin:9px 0 0}
.how{background:radial-gradient(ellipse at 20% 20%,#392313,#170e08 75%);color:#fff;padding:25px 0}
.how-grid{display:grid;grid-template-columns:1.25fr repeat(4,1fr);gap:20px;align-items:start}
.how h2{font:700 36px Georgia,serif;margin:0 0 10px}
.how h2 span{color:#e9a45b}
.how-intro{font-size:14px;line-height:1.45;margin:0}
.step{font-size:11px;line-height:1.4}
.step-icon{width:52px;height:52px;border:2px solid #efb45d;color:#efb45d;border-radius:50%;display:grid;place-items:center;margin:0 auto 9px;font-size:22px}
.step strong{display:block;font-size:11px;margin-bottom:4px}
.step p{margin:0;color:#e3d9d0}
.team{display:grid;grid-template-columns:.9fr 1.4fr;background:#f7f2ed;align-items:stretch}
.team-copy{padding:26px 22px}
.team-copy h2{font:700 34px Georgia,serif;margin:0 0 8px}
.team-copy p{font-size:14px;line-height:1.45;color:#626873;margin:0;max-width:380px}
.team img{width:100%;height:100%;min-height:175px;max-height:220px;object-fit:cover;object-position:center 43%}
.faq{padding:21px 0;background:#fbf8f4}
.faq h2{font:700 34px Georgia,serif;margin:0 0 11px}
.faq-list{display:grid;gap:6px}
.faq-item{border-radius:8px;background:#fff;box-shadow:0 2px 8px #28180d0a;overflow:hidden}
.faq-question{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:12px 17px;font-weight:700;font-size:13px;color:#202938;cursor:pointer}
.plus{height:22px;width:22px;border-radius:50%;display:grid;place-items:center;background:#b8753d;color:white;font-size:18px;flex:none}
.faq-answer{display:none;padding:0 17px 12px;color:#626873;font-size:12px;line-height:1.5}
.faq-item.open .faq-answer{display:block}
.footer{background:radial-gradient(ellipse at 40% 0,#3a2112,#1b1009 70%);color:#fff;padding:18px 0}
.footer-grid{display:grid;grid-template-columns:1.2fr 1fr .8fr .7fr;gap:20px;align-items:center}
.footer-logo{width:230px;max-width:100%;height:74px;object-fit:contain;object-position:left center}
.contact{display:flex;align-items:center;gap:10px;font-size:12px;line-height:1.45}
.contact a{text-decoration:none}
@media(max-width:850px){
.wrap{width:min(100% - 30px,680px)}
.topbar{padding:10px 0;align-items:flex-start}
.brand{max-width:42%;width:220px;height:58px}
.nav{gap:10px;flex-wrap:wrap;justify-content:flex-end;font-size:11px}
.nav-cta{padding:9px 11px}
.hero{background-position:58% center}
.intake-grid{grid-template-columns:1fr}
.how-grid{grid-template-columns:repeat(4,1fr)}
.how-lead{grid-column:1/-1}
.team{grid-template-columns:1fr 1.1fr}
.footer-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:540px){
.topbar{display:block}
.brand{max-width:100%;width:230px;height:60px}
.nav{justify-content:flex-start;margin-top:5px}
.nav a:not(.nav-cta){display:none}
.hero{background-image:linear-gradient(90deg,rgba(24,13,7,.93),rgba(35,18,8,.72)),url('hero-clinica.jpg');background-position:60% center}
.hero-content{padding:25px 0 22px;min-height:0}
.hero h1{font-size:42px}
.hero-copy{font-size:14px}
.benefits{gap:12px}
.benefit{font-size:11px}
.benefit-icon{width:38px;height:38px}
.section-title{font-size:28px}
.treatment-grid{grid-template-columns:1fr}
.how-grid{grid-template-columns:1fr 1fr;gap:16px}
.how h2{font-size:32px}
.step-icon{margin-left:0}
.team{grid-template-columns:1fr}
.team img{grid-row:1;max-height:180px}
.team-copy{padding:20px 18px}
.faq h2{font-size:30px}
.footer-grid{grid-template-columns:1fr;gap:13px}
.footer-logo{height:65px}
}
</style>
</head>
